<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Check</title>
<style>body{font-family:system-ui,sans-serif;background:#0F1E2E;color:#fff;margin:0;padding:20px}h1{font-size:22px}#s{font-size:17px;font-weight:700;margin:14px 0}.r{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid rgba(255,255,255,.1);font-size:14px}.open{color:#F87171;font-weight:800}.ok{color:#5EEAD4}</style></head><body>
<h1>Mavis lock check</h1><div id="s">Checking…</div><div id="l"></div>
<script>
const U='https://qjxcpmkiyfrukxicdwkl.supabase.co/rest/v1/',K='sb_publishable_bHRgdmEZPalEJSMBBr8prQ_Qhu_h1X9',T='alerts_sent announcement_replies announcements app_errors app_settings bar_areas bar_menus bar_recipes business_metrics cal_calendars cal_events cal_notes chat_group_messages chat_marks chat_members chat_messages chat_msgs chat_prefs chat_reads chat_threads companies cron_secret customer_contacts customer_survey_entries dj_bookings dj_settings dj_staff_hours dj_stages drive_files drive_folders events guest_page guest_page_hits highlights invites invoices job_vacancies kb_faqs kitchen_allergen_dishes kitchen_areas kitchen_links kitchen_menus kitchen_recipes login_attempts mavis_enquiries meetings member_keyrings member_visits members music_playlists order_catalog order_files order_items order_notes order_payments orders owner_settings personal_task_cards personal_task_projects profiles push_subs quick_links request_notes requests roster_links rosters rss_news_items sandbox_items shared_files shared_folders sop_departments sop_docs sticky_notes suggestions task_board_columns task_cards task_projects vendor_departments vendor_items'.split(' ');
(async()=>{const res=await Promise.all(T.map(async t=>{try{const r=await fetch(U+t+'?select=*&limit=3',{headers:{apikey:K,Authorization:'Bearer '+K}});const d=await r.json();return [t,Array.isArray(d)?d.length:-1,r.status];}catch(e){return [t,-2,0]}}));
const open=res.filter(x=>x[1]>0);document.getElementById('s').innerHTML=open.length?'<span class="open">'+open.length+' OPEN - screenshot this</span>':'<span class="ok">All locked ✓</span>';
open.sort((a,b)=>a[0]<b[0]?-1:1);document.getElementById('l').innerHTML=res.sort((a,b)=>(b[1]>0)-(a[1]>0)).map(([t,n,s])=>'<div class="r"><span>'+t+'</span><span class="'+(n>0?'open':'ok')+'">'+(n>0?'OPEN':n===0?'locked':'blocked '+s)+'</span></div>').join('');})();
</script></body></html>
