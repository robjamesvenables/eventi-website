<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Roles and Permissions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0F1E2E;--teal:#0D9488;--gold:#C4973B;--line:#E2E8F0;--mute:#94A3B8;--soft:#64748B;--bg:#F4F4F4}
html,body{background:var(--bg);color:var(--navy);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
/* sidebar - same as the membership-only app */
.sb{width:232px;flex:none;background:var(--navy);color:#CBD5E1;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand img{width:36px;height:36px;border-radius:50%;background:#fff}
.brand b{display:block;color:#fff;font-size:14px;font-weight:800;line-height:1.2}.brand small{font-size:10px;letter-spacing:.14em;color:#C9A24A;font-weight:700}
.sec{font-size:10.5px;letter-spacing:.14em;color:#64748B;font-weight:700;padding:14px 10px 6px;text-transform:uppercase}
.lk{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;font-size:13.5px;font-weight:600;color:#CBD5E1}
.lk svg{width:17px;height:17px;flex:none}
.lk.on{background:rgba(255,255,255,.1);color:#fff}
.main{flex:1;min-width:0;padding:28px 28px 60px;max-width:1000px;margin:0 auto}.sub{margin-bottom:20px}
.ttl{font-size:24px;font-weight:800}.sub{font-size:13.5px;color:var(--soft);margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#E6F4F2;color:var(--teal);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;margin-left:8px;vertical-align:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 22px}
.stats div{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}.stats b{display:block;font-size:22px;font-weight:800}.stats span{font-size:11.5px;color:var(--mute);font-weight:600}
.tabs{display:flex;gap:4px;background:#E9EDF2;padding:4px;border-radius:10px;width:fit-content;margin-bottom:20px}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:7px;font-size:13px;font-weight:700;color:var(--soft);display:flex;align-items:center;gap:7px}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.h{font-size:12.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}.hs{font-size:12.5px;color:var(--mute);margin-bottom:14px;max-width:640px;line-height:1.45}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.role{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left}
.role.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.role i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;margin-bottom:10px;font-style:normal}
.role b{display:block;font-size:14.5px;font-weight:800}.role small{font-size:12px;color:var(--soft);font-weight:600}
.role .bar{height:5px;border-radius:4px;background:#EEF2F6;margin-top:10px;overflow:hidden}.role .bar span{display:block;height:100%;background:var(--teal);border-radius:4px}
.ed{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.edh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1.5px solid var(--line)}
.edh b{font-size:16px;font-weight:800}.edh small{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.ppl{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;border-bottom:1.5px solid var(--line);background:#FAFBFC}
.pc{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700}
.pc i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:800;color:#fff;flex:none}
.pc em{font-style:normal;font-size:10.5px;font-weight:700;color:#B45309;background:#FEF3C7;border-radius:999px;padding:2px 7px}
.pf{display:none;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--teal);border-radius:999px;padding:3px 3px 3px 12px}.pf input{border:0;outline:0;font:600 13px Inter,sans-serif;color:var(--navy);width:130px;min-width:0;background:none}.pf button{border:0;background:var(--teal);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.pc em{color:#047857;background:#D1FAE5}
.pa{border:1.5px dashed var(--teal);background:#fff;color:var(--teal);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.grp{padding:6px 18px 4px}.grp+.grp{border-top:1px solid #F1F5F9}
.gh{font-size:10.5px;letter-spacing:.14em;color:var(--gold);font-weight:800;text-transform:uppercase;padding:12px 0 4px}
.pr{display:flex;align-items:center;gap:12px;padding:10px 0}
.pr div{flex:1;min-width:0}.pr b{display:block;font-size:14px;font-weight:700}.pr small{display:block;font-size:12px;color:var(--soft);margin-top:1px;line-height:1.35}
.sw{width:44px;height:26px;border-radius:999px;background:#CBD5E1;border:0;position:relative;flex:none;transition:background .15s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--teal)}.sw.on:after{left:21px}.sw.lock{opacity:.55;cursor:default}
.note{display:flex;gap:10px;align-items:flex-start;background:#F8FAFC;border-radius:12px;padding:12px 14px;margin:14px 18px 18px;font-size:12.5px;color:var(--soft);line-height:1.45}
.note svg{flex:none;margin-top:1px}
/* people */
.pp{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.pph{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.pph b{font-size:16px;font-weight:800}.pph small{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.add{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:700}
.prow{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid #F1F5F9}
.prow:last-child{border:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex:none}
.prow div{flex:1;min-width:0}.prow b{display:block;font-size:14px;font-weight:700}.prow small{font-size:12px;color:var(--soft)}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.wait{font-size:11px;font-weight:700;color:#B45309;background:#FEF3C7;border-radius:999px;padding:3px 8px;margin-left:6px}
.hide{display:none}
.tabs .sm{display:none}
/* phone */
.top{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 20px}.top img{width:32px;height:32px;border-radius:50%;background:#fff}.top b{font-size:14px;font-weight:800}.top small{display:block;font-size:9.5px;letter-spacing:.14em;color:#C9A24A;font-weight:700}
@media(max-width:860px){
  .sb{display:none}
  .top{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:2}
  .top img{width:30px;height:30px;border-radius:50%;background:#fff}.top b{font-size:14px;font-weight:800}.top small{display:block;font-size:9.5px;letter-spacing:.14em;color:#C9A24A;font-weight:700}
  .app{display:block}.main{padding:18px 16px 50px}
  .ttl{font-size:21px}.chip{margin:6px 0 0;display:inline-flex}
  .stats{grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
  .roles{grid-template-columns:1fr 1fr;gap:8px}.role{padding:12px}
  .tabs{width:100%}.tabs button{flex:1;justify-content:center;padding:9px 8px}
  .role small{font-size:11px}.tabs .lg{display:none}.tabs .sm{display:inline}
  .grp{padding:4px 14px}.edh,.pph{padding:14px}.prow{padding:10px 14px}.note{margin:12px 14px 14px}
}
.ov{position:fixed;inset:0;background:rgba(15,30,46,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.ov.show{display:flex}
.sheet{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.shh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}.shh b{font-size:18px;font-weight:800}.x{border:0;background:#F1F5F9;width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:var(--soft)}
.shb{padding:8px 20px 4px;display:flex;flex-direction:column;gap:12px}
.shb label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--soft);min-width:0}.opt{font-weight:500;color:var(--mute)}
.shb input{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:500 15px Inter,sans-serif;color:var(--navy);width:100%;min-width:0;outline:0}.shb input:focus{border-color:var(--teal)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab{font-size:12.5px;font-weight:700;color:var(--soft);margin-bottom:-4px}
.rps{display:flex;flex-wrap:wrap;gap:6px}.rp{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--soft)}.rp.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hint{font-size:12.5px;color:var(--soft);background:#F8FAFC;border-radius:10px;padding:10px 12px;line-height:1.45}.err{font-size:13px;color:#DC2626;font-weight:600;min-height:2px}
.shf{display:flex;gap:8px;padding:12px 20px 18px}.cn{border:0;background:#F1F5F9;color:var(--navy);border-radius:12px;padding:13px 16px;font-size:14px;font-weight:700}.ok{flex:1;border:0;background:var(--teal);color:#fff;border-radius:12px;padding:13px 16px;font-size:14px;font-weight:700}
@media(max-width:860px){.ov{align-items:flex-end;padding:0}.sheet{border-radius:20px 20px 0 0;max-height:92vh}}
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt=""><div><b>The Trans Resort Bali</b><small>MEMBERS CLUB</small></div></div>
<div class="app">

  <main class="main">
    <div class="ttl">Roles &amp; Permissions <span class="chip">Members Club</span></div>
    <div class="sub">Choose what each role on your team can do. Tap a role, then switch things on or off.</div>

    <section id="t-roles">
      <div class="roles" id="roles"></div>
      <div class="ed">
        <div class="edh"><div><b id="rn"></b><small id="rs"></small></div></div>
        <div class="ppl" id="ppl"></div>
        <div id="perms"></div>
        <div class="note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span id="nt"></span></div>
      </div>
    </section>

  </main>
</div>
<div class="ov" id="addp"><div class="sheet" role="dialog" aria-label="Add a team member">
  <div class="shh"><b>Add a team member</b><button class="x" onclick="closeAdd()" aria-label="Close">×</button></div>
  <div class="shb">
    <div class="two2"><label>First name<input id="af" autocomplete="off" placeholder="e.g. Putu"></label><label>Last name<input id="al" autocomplete="off" placeholder="e.g. Ariani"></label></div>
    <label>WhatsApp number<input id="aw" inputmode="tel" placeholder="+62 812 ..."></label>
    <label><span>Email <span class="opt">(optional)</span></span><input id="ae" inputmode="email" placeholder="name@thetrans.com"></label>
    <div class="lab">Role</div><div class="rps" id="ar"></div>
    <div class="hint">They get a WhatsApp with a link to set their own password. Their role decides what they can do.</div>
    <div class="err" id="aerr"></div>
  </div>
  <div class="shf"><button class="cn" onclick="closeAdd()">Cancel</button><button class="ok" onclick="saveAdd()">Add and send invite</button></div>
</div></div>
<script>
var ROLES = [
  { id:'mgr', n:'Manager', c:'#0F1E2E', bg:'#E8ECF1', ppl:3 },
  { id:'gro', n:'Reception', c:'#0D9488', bg:'#E6F4F2', ppl:5 },
  { id:'fnb', n:'Waiter & Bar', c:'#C4973B', bg:'#F6EEDD', ppl:4 },
  { id:'mkt', n:'Marketing', c:'#7C3AED', bg:'#EFE9FB', ppl:2 }
];
var GROUPS = [
  ['Members', [
    ['scan', 'Scan a member', 'Check guests in with their keyring or card'],
    ['signup', 'Sign up new members', 'Set up a new keyring or digital card'],
    ['list', 'See the member list', 'Search members and see who\'s in today'],
    ['spend', 'See visits and spend', 'How often each member comes, and what they spend'],
    ['edit', 'Edit a member', 'Change name, phone, birthday or notes'],
    ['vip', 'Make someone VIP', 'Upgrade a member to the black VIP card']]],
  ['Messages', [
    ['wa', 'Send WhatsApp and email offers', 'Off = they can ask, and a manager says OK'],
    ['push', 'Send phone alerts', 'Buzz every member\'s phone at once']]],
  ['Reports', [
    ['ins', 'See insights', 'Top members, busiest days, places'],
    ['rep', 'Download reports', 'The PDF and CSV reports']]],
  ['Guest page and settings', [
    ['page', 'Change the guest page', 'Photos, deals, events, video'],
    ['set', 'Change Members Club settings', 'Perks, alerts, who can send']]],
  ['Phone alerts for this role', [
    ['avip', 'When a VIP checks in', 'So someone can say hello'],
    ['afb', 'When a guest gives 1 to 3 stars', 'So someone can go and see them']]]
];
var ON = {
  mgr: { scan:1, signup:1, list:1, spend:1, edit:1, vip:1, wa:1, push:1, ins:1, rep:1, page:1, set:1, avip:1, afb:1 },
  gro: { scan:1, signup:1, list:1, edit:1, avip:1 },
  fnb: { scan:1, signup:1 },
  mkt: { list:1, spend:1, wa:1, push:1, ins:1, rep:1, page:1 }
};
var NOTE = {
  mgr: 'Managers can always do everything. The hotel\'s owner decides who is a manager.',
  gro: 'Reception signs guests up and checks them in. They can\'t see spend or send messages.',
  fnb: 'Waiters and bar staff only scan keyrings and sign people up. Nothing else, so nothing can go wrong.',
  mkt: 'Marketing sends offers and keeps the guest page fresh. They don\'t check guests in.'
};
var PEOPLE = { mgr:[['Greta S.'], ['James S.'], ['Alex R.']], gro:[['I Gede Bagus T.'], ['Sarah C.'], ['Made W.'], ['Kadek P.'], ['Tina M.']], fnb:[['John S.'], ['Peter J.'], ['David W.'], ['Luna T.']], mkt:[['Emma E.'], ['Putu A.']] };
function openAdd(){
  var o = document.getElementById('addp');
  document.getElementById('af').value = ''; document.getElementById('al').value = ''; document.getElementById('aw').value = ''; document.getElementById('ae').value = '';
  document.getElementById('ar').innerHTML = ROLES.map(function(r){ return '<button type="button" class="rp' + (r.id === cur ? ' on' : '') + '" data-v="' + r.id + '">' + r.n + '</button>'; }).join('');
  [].forEach.call(document.querySelectorAll('#ar .rp'), function(b){ b.onclick = function(){ [].forEach.call(document.querySelectorAll('#ar .rp'), function(x){ x.classList.toggle('on', x === b); }); }; });
  document.getElementById('aerr').textContent = ''; o.classList.add('show'); setTimeout(function(){ document.getElementById('af').focus(); }, 50);
}
document.addEventListener('input', function(e){ if(e.target.closest && e.target.closest('#addp')) document.getElementById('aerr').textContent = ''; });
function closeAdd(){ document.getElementById('addp').classList.remove('show'); }
function saveAdd(){
  var f = document.getElementById('af').value.trim(), l = document.getElementById('al').value.trim(), w = document.getElementById('aw').value.replace(/[^\d+]/g, '');
  if(!f){ document.getElementById('aerr').textContent = 'Add their first name'; return; }
  if(w.replace(/\D/g, '').length < 8){ document.getElementById('aerr').textContent = 'Add their WhatsApp number, so they get their login link'; return; }
  var cap = function(x){ return x.replace(/\b\w/g, function(c){ return c.toUpperCase(); }); };
  var role = (document.querySelector('#ar .rp.on') || {}).dataset; role = role ? role.v : cur;
  PEOPLE[role].push([cap(f) + (l ? ' ' + cap(l).charAt(0) + '.' : ''), 1]); cur = role; closeAdd(); draw();
}
var ALL = GROUPS.reduce(function(n, g){ return n + g[1].length; }, 0), cur = 'gro';
function count(id){ return Object.keys(ON[id]).filter(function(k){ return ON[id][k]; }).length; }
function draw(){
  document.getElementById('roles').innerHTML = ROLES.map(function(r){ var c = count(r.id);
    return '<button class="role' + (r.id === cur ? ' on' : '') + '" data-r="' + r.id + '"><i style="background:' + r.bg + ';color:' + r.c + '"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/></svg></i><b>' + r.n + '</b><small>' + PEOPLE[r.id].length + ' people · ' + c + ' of ' + ALL + ' on</small><div class="bar"><span style="width:' + Math.round(c / ALL * 100) + '%"></span></div></button>'; }).join('');
  var r = ROLES.filter(function(x){ return x.id === cur; })[0], lock = cur === 'mgr';
  document.getElementById('rn').textContent = r.n;
  document.getElementById('rs').textContent = PEOPLE[cur].length + ' people · ' + count(cur) + ' of ' + ALL + ' switched on';
  document.getElementById('nt').textContent = NOTE[cur];
  document.getElementById('ppl').innerHTML = PEOPLE[cur].map(function(p){ var ini = p[0].split(' ').map(function(w){ return w[0]; }).slice(0, 2).join('');
    return '<span class="pc"><i style="background:' + r.c + '">' + ini + '</i>' + p[0] + (p[1] ? ' <em>Invite sent ✓</em>' : '') + '</span>'; }).join('') + '<button class="pa" id="padd">+ Add person</button>';
  document.getElementById('padd').onclick = openAdd;
  document.getElementById('perms').innerHTML = GROUPS.map(function(g){
    return '<div class="grp"><div class="gh">' + g[0] + '</div>' + g[1].map(function(p){ var on = !!ON[cur][p[0]];
      return '<div class="pr"><div><b>' + p[1] + '</b><small>' + p[2] + '</small></div><button class="sw' + (on ? ' on' : '') + (lock ? ' lock' : '') + '" data-p="' + p[0] + '" aria-label="' + p[1] + '"></button></div>'; }).join('') + '</div>'; }).join('');
  [].forEach.call(document.querySelectorAll('.role'), function(b){ b.onclick = function(){ cur = b.dataset.r; draw(); }; });
  [].forEach.call(document.querySelectorAll('.sw'), function(b){ b.onclick = function(){ if(cur === 'mgr') return; ON[cur][b.dataset.p] = ON[cur][b.dataset.p] ? 0 : 1; draw(); }; });
}
draw();
</script>
</body>
</html>
