<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan The Trans</title><meta name="robots" content="noindex">
<style>
:root{--top:#7A1F1F;--gold:#C9A24A;--ink:#FBF8F1}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--top);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:3vh 16px;overflow:hidden;text-align:center}
h1{font-size:clamp(26px,4.2vh,52px);font-weight:900;letter-spacing:-.01em;line-height:1.1}
h1 em{font-style:normal;color:var(--gold)}
.row{display:flex;align-items:center;justify-content:center;gap:5vw}
.col{display:flex;flex-direction:column;align-items:center;gap:2vh}
.lab{font-size:clamp(16px,2.6vh,30px);font-weight:800;color:var(--ink)}.lab b{color:var(--gold)}
.or{font-size:clamp(18px,3vh,34px);font-weight:900;color:var(--gold);letter-spacing:.1em}
.card{background:#fff;border-radius:4vh;padding:2.4vh;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.card img{display:block;height:min(62vh,40vw);width:auto;aspect-ratio:1}
.kr{position:relative;height:calc(min(62vh,40vw) + 4.8vh);aspect-ratio:390/806;border-radius:3vh;overflow:hidden;border:6px solid #fff;box-shadow:0 30px 70px rgba(0,0,0,.35);background:#2A1A12}
.kr img{width:100%;height:100%;object-fit:cover;display:block}
.tgt{position:absolute;left:15.5%;width:55%;top:58.5%;aspect-ratio:1;transform:rotate(6deg);transform-origin:center;
  --c:#2DD4BF;background:linear-gradient(var(--c),var(--c)) 0 0/22% 4px,linear-gradient(var(--c),var(--c)) 0 0/4px 22%,
  linear-gradient(var(--c),var(--c)) 100% 0/22% 4px,linear-gradient(var(--c),var(--c)) 100% 0/4px 22%,
  linear-gradient(var(--c),var(--c)) 0 100%/22% 4px,linear-gradient(var(--c),var(--c)) 0 100%/4px 22%,
  linear-gradient(var(--c),var(--c)) 100% 100%/22% 4px,linear-gradient(var(--c),var(--c)) 100% 100%/4px 22%;
  background-repeat:no-repeat;filter:drop-shadow(0 0 6px #2DD4BF);border-radius:6px;animation:tgt 1.6s ease-in-out infinite alternate}
@keyframes tgt{from{transform:rotate(6deg) scale(1.04)}to{transform:rotate(6deg) scale(.97)}}
.tgt i{position:absolute;left:6%;right:6%;height:3px;border-radius:2px;background:#2DD4BF;box-shadow:0 0 14px 2px #2DD4BF;animation:tl 1.6s ease-in-out infinite alternate}
@keyframes tl{from{top:8%}to{top:90%}}
@media (prefers-reduced-motion:reduce){.tgt,.tgt i{animation:none}.tgt i{top:50%}}
@media (max-aspect-ratio:1/1){   /* phone held upright: one under the other */
  body{overflow:auto;justify-content:flex-start;padding:5vh 16px 6vh;gap:3vh}
  .row{flex-direction:column;gap:2.5vh}
  .card img{height:auto;width:min(72vw,42vh)}
  .kr{height:min(46vh,110vw)}
  .lab{font-size:18px}.or{font-size:20px}
}
</style></head><body>
<h1>Scan with your phone: <em>The Trans members app</em></h1>
<div class="row">
  <div class="col"><div class="card"><img src="qr.png" alt="QR code that opens The Trans members app"></div><div class="lab">Scan the screen</div></div>
  <div class="or">OR</div>
  <div class="col"><div class="kr"><img src="k-trans.jpg" alt="The Trans keyring"><span class="tgt"><i></i></span></div><div class="lab">Scan the <b>real keyring</b> as it comes round</div></div>
</div>
</body></html>
