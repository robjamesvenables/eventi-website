<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan The Trans</title><meta name="robots" content="noindex">
<style>
:root{--top:#7A1F1F;--gold:#C9A24A;--ink:#FBF8F1}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--top);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;padding:3vh 16px;overflow:hidden;text-align:center}
h1{font-size:clamp(26px,4.2vh,52px);font-weight:900;letter-spacing:-.01em;line-height:1.1}
h1 em{font-style:normal;color:var(--gold)}
.card{background:#fff;border-radius:4vh;padding:2.4vh;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.card img{display:block;height:min(76vh,92vw);width:auto;aspect-ratio:1}
</style></head><body>
<h1>Scan with your phone: <em>The Trans members app</em></h1>
<div class="card"><img src="qr.png" alt="QR code that opens The Trans members app"></div>
</body></html>
