<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>28th Sky Beach Club · Floor plan</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F0E6;--card:#FBF8F2;--ink:#2A2622;--mut:#8C8377;--line:#E4DCCD;--gold:#B8914A;--gold2:#E6C77E;
--z1:#8DAA7E;--z2:#C9A46A;--z3:#C46A4E;--z4:#B07C9E;--z5:#5E8C86}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:40px 40px 48px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.k{font-size:12px;font-weight:700;letter-spacing:4px;color:var(--gold)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:52px;line-height:1;margin-top:8px;letter-spacing:-.5px}
.date{display:flex;gap:8px}
.date button{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
.date button.on{background:var(--ink);border-color:var(--ink);color:#F5F0E6}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.chip{font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 8px;font-size:14px;font-weight:600;color:var(--ink);transition:.2s}
.chip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;font-weight:800}
.chip span{color:var(--mut);font-weight:500}
.chip.off{opacity:.4}
.chip:hover{border-color:#CDBFA8}
.board{position:relative;margin-top:18px;background:var(--card);border-radius:28px;padding:22px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 30px 60px -30px rgba(80,60,30,.25)}
svg{display:block;width:100%;height:auto}
.sp{cursor:pointer}
.sp .b{transition:transform .18s ease,filter .18s;transform-box:fill-box;transform-origin:center}
.sp:hover .b{transform:scale(1.06)}
.sp.bk{cursor:default}.sp.bk:hover .b{transform:none}
.sp.sel .b{filter:drop-shadow(0 0 0 var(--gold)) drop-shadow(0 6px 14px rgba(184,145,74,.55))}
.sp.dim{opacity:.18}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#F5F0E6;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .15s;z-index:5}
.tip b{display:block;font-size:14.5px}
.tip span{color:#C9BFAE}
.tip:after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tip.on{opacity:1}
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:18px;flex-wrap:wrap}
.leg{display:flex;gap:18px;font-size:13px;color:var(--mut);font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:7px}
.leg i{width:14px;height:14px;border-radius:5px;display:inline-block}
.pick{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px 12px 18px;min-width:420px;min-height:66px}
.pick .em{color:var(--mut);font-size:14px}
.pick b{display:block;font-size:16px}
.pick small{color:var(--mut);font-size:13px}
.pick .pr{margin-left:auto;text-align:right;font-size:14px;font-weight:700}
.pick .pr s{display:block;font-size:12px;color:var(--mut);font-weight:500}
.pick button{font:inherit;border:0;cursor:pointer;background:var(--ink);color:#F5F0E6;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px}
@media(max-width:760px){.wrap{padding:22px 14px}h1{font-size:36px}.date{overflow-x:auto;max-width:100%}.date button{flex:none;padding:8px 13px;font-size:13px}.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-14px;margin-right:-14px;padding:0 14px}.chips::-webkit-scrollbar{display:none}.chip{flex:none;font-size:13px}.board{padding:10px;border-radius:18px;overflow-x:auto;-webkit-overflow-scrolling:touch}.board svg{width:900px;max-width:none}.pick{min-width:0;width:100%}.swipe{display:block!important}}
.swipe{display:none;font-size:12.5px;color:var(--mut);margin-top:8px;text-align:center}
</style></head>
<body>
<div class="wrap">
  <div class="top">
    <div><p class="k">THE TRANS SURABAYA · 28TH FLOOR</p><h1>Sky Beach Club</h1></div>
    <div class="date" id="date"><button class="on">Today</button><button>Tomorrow</button><button>Sat 22</button><button>Sun 23</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <p class="swipe">Swipe the plan sideways to see it all</p><div class="board" id="board"><svg id="plan" viewBox="0 0 1200 700"></svg><div class="tip" id="tip"></div></div>
  <div class="foot">
    <div class="leg"><span><i style="background:#fff;box-shadow:inset 0 0 0 2px #CDBFA8"></i>Available</span><span><i style="background:#E7E0D3"></i>Booked</span><span><i style="background:var(--gold2)"></i>Selected</span></div>
    <div class="pick" id="pick"><span class="em">Tap a lounger, table, cabana or pool</span></div>
  </div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},NS='http://www.w3.org/2000/svg';
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

       2:{t:'Beach loungers',c:'#C9A46A',cap:'1–2 guests',p:'Free for hotel guests'},
       3:{t:'Dining tables',c:'#C46A4E',cap:'2–4 guests',p:'Dining only'},
       4:{t:'Cabanas',c:'#B07C9E',cap:'6–12 guests',p:'IDR 1,000,000',h:'Hotel guests 50% off'},
       5:{t:'Sunken pools',c:'#5E8C86',cap:'3–8 guests',p:'IDR 2,000,000',h:'Hotel guests 50% off'}};
var S=[],i;
for(i=0;i<11;i++)S.push({id:'L'+(i+1),z:1,k:'lv',x:178+50*i,y:180,w:36,h:94,n:'Sun lounger '+(i+1)});
for(i=0;i<8;i++)S.push({id:'B'+(i+1),z:2,k:'lh',x:1004,y:286+44*i,w:92,h:30,n:'Beach lounger '+(i+1)});
[[720,330],[800,330],[880,330],[960,330],[690,410],[650,480],[700,550],[650,620],[810,670],[880,670],[950,670]].forEach(function(p,j){S.push({id:'T'+(j+1),z:3,k:'t',x:p[0],y:p[1],r:19,n:'Table '+(j+1)});});
for(i=0;i<3;i++)S.push({id:'C'+(i+1),z:4,k:'c',x:178+128*i,y:312,w:114,h:92,n:'Cabana '+(i+1)});
for(i=0;i<3;i++)S.push({id:'P'+(i+1),z:5,k:'p',x:265+118*i,y:612,r:50,n:'Sunken pool '+(i+1)});
var solo=0,BK={L2:1,L3:1,L8:1,B2:1,B5:1,T2:1,T6:1,T10:1,C1:1,P2:1},sel=null,off={};

   '<linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DCE7E1"/><stop offset="1" stop-color="#C6D8D1"/></linearGradient>'+

   '<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5A4630" flood-opacity=".16"/></filter>';
  // deck

  var bt=txt('BEACH',1160,480,12,'#A8895A',5);bt.setAttribute('transform','rotate(90 1160 480)');

  el('circle',{cx:530,cy:490,r:48,fill:'none',stroke:'#B8914A','stroke-width':1.5},svg);
  for(i=0;i<10;i++){var a=i/10*Math.PI*2;el('circle',{cx:530+Math.cos(a)*76,cy:490+Math.sin(a)*76,r:6,fill:'#D7CCB9'},svg);}

        for(var t=0;t<3;t++)el('line',v?{x1:s.x+8,x2:s.x+s.w-8,y1:s.y+38+t*14,y2:s.y+38+t*14,stroke:z.c,'stroke-width':1.2,opacity:.35}:{y1:s.y+7,y2:s.y+s.h-7,x1:s.x+14+t*16,x2:s.x+14+t*16,stroke:z.c,'stroke-width':1.2,opacity:.35},b);}
    } else if(s.k==='t'){

      if(!bk){el('rect',{x:s.x+10,y:s.y+10,width:s.w-20,height:s.h-20,rx:10,fill:'none',stroke:z.c,'stroke-width':1.2,'stroke-dasharray':'3 4',opacity:.6},b);
        el('rect',{x:s.x+s.w/2-26,y:s.y+s.h/2-16,width:52,height:32,rx:8,fill:z.c,opacity:.9},b);

  });
  // zone tags
  [[1,745,227],[4,190,425],[3,612,345],[2,1050,262],[5,148,612]].forEach(function(t){var z=t[0],g=el('g',{},svg);el('circle',{cx:t[1],cy:t[2],r:14,fill:Z[z].c},g);txt(String(z),t[1],t[2]+5,13,'#fff',0,g);});
  paint();
}
function txt(t,x,y,s,c,ls,p){var e=el('text',{x:x,y:y,'text-anchor':'middle','font-family':'Inter,Arial','font-weight':700,'font-size':s,fill:c,'letter-spacing':ls||0},p||svg);e.textContent=t;return e;}

  if(!BK[id]){var r=g.querySelector('.b > rect, .b > circle:last-of-type');var main=g.querySelector('.b').firstElementChild;if(s.k==='t')main=g.querySelectorAll('.b > circle')[0];main.setAttribute('fill',sel===id?'#F3DFA8':'#fff');main.setAttribute('stroke',sel===id?'#B8914A':Z[s.z].c);main.setAttribute('stroke-width',sel===id?3.5:(s.k==='t'||s.k==='p'?2.5:2));}});

  $('chips').innerHTML=h;[].forEach.call($('chips').children,function(b){b.onclick=function(){var z=+b.getAttribute('data-z');solo=solo===z?0:z;off={};if(solo)[1,2,3,4,5].forEach(function(k){if(k!==solo)off[k]=1;});paint();};});
}
function tip(s,on){var t=$('tip');if(!on){t.classList.remove('on');return;}var z=Z[s.z];
  t.innerHTML='<b>'+s.n+'</b><span>'+(BK[s.id]?'Booked':z.cap+' · '+z.p)+'</span>';
  var bb=$('board').getBoundingClientRect(),sb=svg.getBoundingClientRect(),k=sb.width/1200,cx=(s.k==='t'||s.k==='p')?s.x:s.x+s.w/2,cy=(s.k==='t'||s.k==='p')?s.y-s.r:s.y;

  var s=S.filter(function(x){return x.id===id;})[0],z=Z[s.z];

})();
</script>
</body></html>
