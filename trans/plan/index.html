<!doctype html>
<html lang="en"><head>

<title>28th Sky Beach Club · Book a spot</title>
<meta name="robots" content="noindex">

<style>
:root{--ink:#1F1B17;--mut:#7C746A;--line:#ECE6DC;--gold:#B8914A;--free:#3BE36B;--bk:#E0483E;--sel:#F6D44A;--pw:430px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2B2620;font-family:Inter,Arial,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
/* map */
#mapw{position:fixed;inset:0;transition:transform .55s cubic-bezier(.2,.8,.2,1);display:grid;place-items:center}
body.open #mapw{transform:translateX(calc(var(--pw) / 2)) scale(.78)}
#mapin{width:min(94vw,calc((100vh - 170px) * 1200 / 700));margin-top:4px;transition:transform .35s ease;transform-origin:center}
#plan{display:block;width:100%;height:auto;filter:drop-shadow(0 30px 50px rgba(0,0,0,.45))}
button svg,.pill svg,.toast svg,.cap svg,.deal svg{display:inline-block;flex:none}
.sp{cursor:pointer}
.sp .o{transition:fill .2s,stroke .2s,stroke-width .2s}
.sp.free .o{fill:rgba(59,227,107,.10);stroke:var(--free);stroke-width:3.5}
.sp.free:hover .o{fill:rgba(59,227,107,.28);stroke-width:5}
.sp.bk .o{fill:rgba(224,72,62,.72);stroke:#C0392B;stroke-width:3}
.sp.sel .o{fill:rgba(246,212,74,.88);stroke:#fff;stroke-width:4}
.sp.sel{filter:drop-shadow(0 0 10px rgba(246,212,74,.9))}
.mk{cursor:default}
/* top bar */
.top{position:fixed;top:14px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:20;pointer-events:none}
.top>*{pointer-events:auto}
.pill{background:#fff;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;padding:7px 16px 7px 7px;font-size:14px;font-weight:600}
.pill img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.pill .dt{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 13px}
.steps{display:flex;align-items:center;gap:6px;padding:8px 18px;font-size:13.5px;font-weight:600;color:#A79F94}
.steps span{display:inline-flex;align-items:center;gap:7px}
.steps span.on{color:var(--ink)}
.steps span.done{color:var(--gold)}
.steps i{font-style:normal;color:#D8D0C4}
.ic{display:flex;gap:8px}
.ic button{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* venue tabs */
.venues{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:20;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
body.open .venues{transform:translateX(calc(-50% + var(--pw) / 2))}
.venues button{border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;color:#4A443C;text-align:center;line-height:1.15}
.venues button small{display:block;font-size:10.5px;font-weight:700;color:#E08A2E}
.venues button.on{background:var(--ink);color:#fff}
.venues button.on small{color:var(--sel)}
.zoom{position:fixed;right:16px;bottom:16px;background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;flex-direction:column;z-index:20}
.zoom button{width:48px;height:48px;font-size:24px;font-weight:500}
.zoom button+button{border-top:1px solid var(--line)}
.legend{position:fixed;left:16px;bottom:22px;display:flex;gap:14px;background:rgba(255,255,255,.92);border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:600;z-index:19;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .3s}
body.open .legend{opacity:0;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px}
/* toast */
.toast{position:fixed;top:78px;left:50%;transform:translate(-50%,-30px);background:#E0483E;color:#fff;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.toast.ok{background:#1F1B17}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* side panel */
.panel{position:fixed;left:0;top:0;bottom:0;width:var(--pw);background:#fff;z-index:30;transform:translateX(-102%);transition:transform .55s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:20px 0 50px rgba(0,0,0,.25)}
body.open .panel{transform:none}
.pb{flex:1;overflow-y:auto;padding:20px 22px 20px;scrollbar-width:thin}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ph h2{font-size:24px;font-weight:800;line-height:1.15}
.ph button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#8A8278;flex:none}
.ph button:hover{background:#F4F0EA}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#F5F1EA;color:#6B6358}
.tags span.hot{background:var(--ink);color:#fff}
.tags span.g{background:#EAF6EE;color:#2E7D4B}
.cap{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px;font-weight:700}
.desc{font-size:14px;color:var(--mut);line-height:1.5;margin-top:6px}
.gal{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:96px 96px;gap:6px;margin-top:14px;border-radius:14px;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal img:first-child{grid-row:1/3}
h4{font-size:15px;font-weight:800;margin-top:22px}
.days{display:flex;gap:7px;margin-top:10px}
.days button{width:58px;border-radius:12px;padding:7px 0;text-align:center;font-size:11px;font-weight:700;border:1.5px solid}
.days button b{display:block;font-size:17px}
.days .f{border-color:#9BE3B1;background:#F1FBF4;color:#2E7D4B}
.days .x{border-color:#F3B1AC;background:#FDF2F1;color:#C0392B}
.days .on{box-shadow:0 0 0 2px #2E7D4B}
.who{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;background:#F5F1EA;border-radius:14px;padding:4px}
.who button{border-radius:11px;padding:10px;font-size:13.5px;font-weight:700;color:#6B6358}
.who button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.deal{margin-top:10px;border:1.5px solid var(--ink);border-radius:16px;padding:14px 16px;position:relative}
.deal .lb{font-size:11.5px;font-weight:800;letter-spacing:1px;color:var(--gold)}
.deal .pr{font-size:22px;font-weight:800;margin-top:4px}
.deal .pr s{font-size:14px;color:#A79F94;font-weight:600;margin-left:8px}
.deal .off{position:absolute;right:14px;top:14px;background:#EAF6EE;color:#2E7D4B;font-size:12px;font-weight:800;padding:4px 9px;border-radius:8px}
.deal ul{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:7px}
.deal li{display:flex;gap:9px;font-size:13.5px;color:#4A443C;align-items:flex-start}
.deal li svg{flex:none;margin-top:1px}
.ex{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ex label{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;transition:.2s}
.ex label img{width:46px;height:46px;border-radius:10px;object-fit:cover}
.ex label b{display:block;font-size:14px}
.ex label span{font-size:12.5px;color:var(--mut)}
.ex label i{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1.5px solid #D9D1C4;display:grid;place-items:center;font-style:normal;font-size:18px;font-weight:600;color:#8A8278;flex:none;transition:.2s}
.ex label.on{border-color:var(--ink)}
.ex label.on i{background:var(--ink);border-color:var(--ink);color:#fff}
.gst{display:flex;align-items:center;justify-content:space-between;margin-top:10px;border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;font-size:14px;font-weight:600}
.gst div{display:flex;align-items:center;gap:12px}
.gst button{width:34px;height:34px;border-radius:10px;background:#F5F1EA;font-size:19px;font-weight:700}
.gst b{min-width:20px;text-align:center;font-size:16px}
.pf{border-top:1px solid var(--line);padding:12px 22px 16px;background:#fff}
.pf p{font-size:12.5px;color:var(--mut);text-align:center}
.pf div{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:10px}
.pf button{border-radius:14px;padding:14px;font-weight:800;font-size:15px}
.pf .a{border:1.5px solid var(--line)}
.pf .b{background:var(--ink);color:#fff}
@media (max-width:760px){
  :root{--pw:100vw}
  body.open #mapw{transform:none}
  #mapw{display:block;overflow-y:auto;overflow-x:hidden;padding:84px 12px 96px;-webkit-overflow-scrolling:touch}
  #mapin{width:100%;max-width:520px;margin:0 auto}
  .pill .dt{white-space:nowrap;font-size:13px;padding:6px 10px}.pill{padding-right:8px}
  .panel{top:auto;height:78vh;width:100%;border-radius:22px 22px 0 0;transform:translateY(102%)}
  body.open .panel{transform:none}
  .steps,.legend{display:none}
  .venues{bottom:12px;max-width:94vw;overflow-x:auto}
  body.open .venues{transform:translateX(-50%)}
  .venues button{flex:none;padding:8px 13px;font-size:13px}
  .zoom{display:none}
}
