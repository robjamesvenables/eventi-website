<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rooms &amp; Suites · The Trans Luxury Hotel Surabaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#EEEAE4;color:#0F1E2E;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:#EEEAE4;position:relative;overflow-x:hidden}
@media(min-width:600px){body{background:#1C1C1C}.app{box-shadow:0 0 40px rgba(0,0,0,.4)}}
.top{background:#1C1C1C;padding:18px 16px 16px;display:flex;align-items:center;gap:12px}
.top img{height:34px}
.mock{font-size:11px;font-weight:800;letter-spacing:.08em;color:#C9A46A;margin-left:auto;border:1px solid #C9A46A;border-radius:99px;padding:4px 9px}
.w{padding:22px 16px 40px}
.lab{font-size:24px;font-weight:900;letter-spacing:-.5px;margin:0 2px 14px}
/* row of cards */
.rmr{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 12px;scrollbar-width:none}.rmr::-webkit-scrollbar{display:none}
.rmc{flex:none;width:78%;max-width:300px;scroll-snap-align:start;background:#fff;border-radius:20px;overflow:hidden;border:2px solid #1C1C1C;box-shadow:0 6px 18px rgba(15,30,46,.14);display:flex;flex-direction:column;cursor:pointer}
.rmc img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-bottom:3px solid #C9A46A}
.rmb{padding:14px;display:flex;flex-direction:column;flex:1}
.rmb b{font-size:17px;font-weight:900;letter-spacing:-.3px}.rmb p{margin:4px 0 0;font-size:13px;color:#64748B;line-height:1.4}
.btns{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.btns a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;font-weight:800;font-size:14px;text-decoration:none}
.bk{background:#1C1C1C;color:#fff}.eq{background:#fff;color:#0F1E2E;border:1.5px solid #CBD5E1}.eq svg{color:#16A34A}
.more{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;background:#1C1C1C;color:#fff;font-weight:800;font-size:14.5px}.more span{color:#C9A46A;font-size:17px}
.rmb p{margin-bottom:14px!important}
.hint{font-size:12.5px;color:#8A8378;margin:6px 2px 0}
/* room page */
.pg{position:fixed;inset:0;z-index:20;background:#EEEAE4;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:440px;margin:0 auto}
.pg.on{transform:none}
.hero{position:relative;height:300px;background:#1C1C1C}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.slides::-webkit-scrollbar{display:none}
.slides img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;scroll-snap-stop:always;transform:translateZ(0)}
.slides,.rmr{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.x{position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:0;display:grid;place-items:center;cursor:pointer}
.cnt{position:absolute;right:14px;bottom:32px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:5px 10px}
.pw{padding:20px 18px 120px;background:#EEEAE4;border-radius:22px 22px 0 0;margin-top:-20px;position:relative}
.pw h1{margin:0;font-size:27px;font-weight:900;letter-spacing:-.5px}.sub{color:#64748B;font-size:14px;margin:6px 0 0;line-height:1.45}
.gal{display:flex;gap:8px;overflow-x:auto;margin:18px -18px 0;padding:0 18px 2px;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:112px;height:84px;object-fit:cover;border-radius:12px;border:2px solid transparent;cursor:pointer}.gal img.on{border-color:#1C1C1C}
.ben{margin-top:20px;padding:12px 0;border-top:1px solid #D8D2C8;border-bottom:1px solid #D8D2C8;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700}
.ben i{font-style:normal;color:#C9A46A;font-size:16px}
.s{margin-top:22px}.s h3{margin:0 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A7B45;display:flex;align-items:center;gap:10px}
.s h3:after{content:'';flex:1;height:1px;background:#D8D2C8}
.s ul{margin:0;padding:0;list-style:none;columns:2;column-gap:18px}.s li{font-size:13.5px;line-height:1.35;padding:5px 0 5px 12px;position:relative;break-inside:avoid;color:#334155}
.s li:before{content:'';position:absolute;left:0;top:12px;width:4px;height:4px;border-radius:50%;background:#C9A46A}
.s.one ul{columns:1}
.soon{margin-top:22px;font-size:13.5px;color:#8A8378;font-style:italic}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#EEEAE4;display:flex;gap:10px;box-shadow:0 -6px 16px rgba(0,0,0,.07);z-index:21;transform:translateY(110%);transition:transform .32s}
.bar.on{transform:none}
.bar a{height:52px;font-size:16px;border-radius:14px}
/* computer with a mouse: left/right arrows (no swiping) */
.rwrap,.hero{position:relative}
.ar{display:none;position:absolute;top:38%;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer;z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ar.l{left:10px}.ar.r{right:10px}.hero .ar{top:calc(50% - 21px);background:rgba(0,0,0,.55)}.hero .ar.l{left:12px}.hero .ar.r{right:12px}
.ar{display:grid;place-items:center}   /* arrows on every device (Robbie 23 Nov) */
@media (hover:none){.ar{width:38px;height:38px;font-size:24px}.rwrap .ar{top:30%}}
</style></head>
<body><div class="app">
<div class="top"><img src="img/logo.png" alt="The Trans Luxury Hotel Surabaya"><span class="mock">PREVIEW</span></div>
<div class="w">
  <div class="lab" id="title">Rooms &amp; Suites</div>
  <div class="rwrap"><div class="rmr" id="row"></div><button class="ar l" data-for="row" data-d="-1" aria-label="Previous">‹</button><button class="ar r" data-for="row" data-d="1" aria-label="Next">›</button></div>
  <div class="hint">Swipe to see all rooms</div>
</div>
</div>
<div class="pg" id="pg"></div>
<div class="bar btns" id="bar"></div>
<script>
var BOOK = 'https://www.transhotelgroup.com/hotel_overview/45';
var WA = '6281118888055';   // reservations, from the hotel's website
var WAI = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9z"/></svg>';
var PREMIER = [
  ['The room', ['Floor-to-ceiling windows', 'Living / sitting area', 'Electric power curtains', 'Air-conditioned', 'Non-smoking', 'Connecting rooms (some rooms)']],
  ['Bed', ['Pillowtop mattress, featherbed and duvet', 'Fresh linen', '1 rollaway bed or crib allowed']],
  ['Bathroom', ['Luxurious marble bathroom', 'Separate bathtub and shower', 'Bidet and hair dryer', '2 robes, 2 pairs of slippers', 'Acqua di Parma shampoo, conditioner and body wash']],
  ['Food & drink', ['Complimentary bottled water', 'Complimentary coffee and tea', 'Mini fridge and kettle', 'Instant hot water']],
  ['Work & entertainment', ['55" Smart TV', 'International channels', 'Free high-speed Wi-Fi', 'Writing desk', 'Dual-voltage outlets', '2 phones']],
  ['Also in the room', ['Sofa and bed stool', 'In-room safe', 'Iron and ironing board', 'Alarm clock']],
  ['Services', ['24-hour STAR service', 'Laundry and dry cleaning', '24-hour Fitness Centre']],
  ['Accessible rooms', ['Mobility-accessible rooms, with roll-in showers, available'], 1]
];
var ROOMS = [
  { name: 'Premier Room', line: 'Effortless comfort in refined contemporary elegance', imgs: ['premier-1', 'premier-2', 'premier-3', 'premier-4', 'premier-5', 'premier-6', 'premier-7', 'premier-8', 'premier-9', 'premier-10'], benefit: 'Acqua di Parma luxurious amenities', details: PREMIER },
  { name: 'Executive Room', line: 'Spacious comfort with panoramic views', imgs: ['executive', 'bath', 'view'] },
  { name: 'Club Premier Room', line: 'Where elevated comfort meets exclusive privileges', imgs: ['club-premier', 'bath', 'amenities'] },
  { name: 'Executive Club Room', line: 'An elevated stay with exclusive Club privileges', imgs: ['executive-club', 'bath', 'view'] },
  { name: 'Presidential Suite', line: 'An iconic expression of luxury at its finest', imgs: ['presidential', 'bath', 'tray'] }
];
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function img(n){ return 'img/' + n + '.jpg'; }
function enq(r){ return 'https://wa.me/' + WA + '?text=' + encodeURIComponent("Hi, it's Alexander, member T6RSBY. I'd like to ask about the " + r.name + '.'); }
function btns(r){ return '<a class="bk" href="' + BOOK + '" target="_blank" rel="noopener">Book</a><a class="eq" href="' + enq(r) + '" target="_blank" rel="noopener">' + WAI + 'Enquire</a>'; }
document.getElementById('row').innerHTML = ROOMS.map(function(r, i){
  return '<div class="rmc" data-i="' + i + '"><img src="' + img(r.imgs[0]) + '" alt=""><div class="rmb"><b>' + esc(r.name) + '</b><p>' + esc(r.line) + '</p><div class="more">See more <span>→</span></div></div></div>';
}).join('');
var pg = document.getElementById('pg'), bar = document.getElementById('bar');
function open(i){
  var r = ROOMS[i];
  pg.innerHTML = '<div class="hero"><div class="slides" id="sl">' + r.imgs.map(function(n){ return '<img src="' + img(n) + '" alt="">'; }).join('') + '</div>' +
    '<button class="x" id="x" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>' +
    '<div class="cnt" id="cnt">1 / ' + r.imgs.length + '</div><button class="ar l" data-for="sl" data-d="-1" aria-label="Previous photo">‹</button><button class="ar r" data-for="sl" data-d="1" aria-label="Next photo">›</button></div>' +
    '<div class="pw"><h1>' + esc(r.name) + '</h1><div class="sub">' + esc(r.line) + '.</div>' +
    '<div class="gal" id="gal">' + r.imgs.map(function(n, k){ return '<img src="img/t-' + n + '.jpg" data-k="' + k + '"' + (k ? '' : ' class="on"') + ' alt="">'; }).join('') + '</div>' +
    (r.benefit ? '<div class="ben"><i>★</i>' + esc(r.benefit) + '</div>' : '') +
    (r.details ? r.details.map(function(s){ return '<div class="s' + (s[2] ? ' one' : '') + '"><h3>' + esc(s[0]) + '</h3><ul>' + s[1].map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>'; }).join('')
      : '<div class="soon">Full room details coming soon.</div>') + '</div>';
  bar.innerHTML = btns(r);
  pg.scrollTop = 0; pg.classList.add('on'); bar.classList.add('on');
  var sl = document.getElementById('sl'), th = document.querySelectorAll('#gal img'), cnt = document.getElementById('cnt');
  var lastK = 0;   // only react when the photo actually changes (smoother sliding)
  sl.addEventListener('scroll', function(){ var k = Math.round(sl.scrollLeft / sl.clientWidth); if (k === lastK) return; lastK = k; cnt.textContent = (k + 1) + ' / ' + r.imgs.length; th.forEach(function(t, j){ t.classList.toggle('on', j === k); }); var g = document.getElementById('gal'), t = th[k]; if (t) g.scrollTo({ left: t.offsetLeft - g.clientWidth / 2 + t.offsetWidth / 2, behavior: 'smooth' }); }, { passive: true });
  r.imgs.forEach(function(n){ var im = new Image(); im.src = img(n); });   // load every photo now so sliding never waits
  function show(k){   // tap a small photo: big photo changes straight away
    lastK = k; cnt.textContent = (k + 1) + ' / ' + r.imgs.length;
    th.forEach(function(t, j){ t.classList.toggle('on', j === k); });
    sl.style.scrollSnapType = 'none'; sl.scrollLeft = sl.clientWidth * k; requestAnimationFrame(function(){ sl.style.scrollSnapType = ''; });
  }
  th.forEach(function(t){ t.onclick = function(){ show(+t.dataset.k); }; });
  pg.querySelectorAll('.hero .ar').forEach(function(a){ a.onclick = function(e){ e.stopPropagation(); var k = Math.max(0, Math.min(r.imgs.length - 1, lastK + +a.dataset.d)); show(k); var g = document.getElementById('gal'), t = th[k]; g.scrollTo({ left: t.offsetLeft - g.clientWidth / 2 + t.offsetWidth / 2, behavior: 'smooth' }); }; });
  document.getElementById('x').onclick = function(){ history.back(); };
  history.pushState({ room: i }, '');
}
function close(){ pg.classList.remove('on'); bar.classList.remove('on'); }
window.addEventListener('popstate', close);
document.addEventListener('click', function(e){   // arrows: move one card / one photo
  var a = e.target.closest('.ar'); if (!a || a.dataset.for !== 'row') return;
  var el = document.getElementById(a.dataset.for), step = a.dataset.for === 'row' ? el.querySelector('.rmc').offsetWidth + 12 : el.clientWidth;
  el.scrollBy({ left: step * +a.dataset.d, behavior: 'smooth' });
});
document.getElementById('row').addEventListener('click', function(e){
  var c = e.target.closest('.rmc'); if (c) open(+c.dataset.i);
});
</script>
</body></html>
