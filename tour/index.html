<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mavis — private preview</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/brand/mavis-favicon-v6.png">
<meta property="og:title" content="Mavis — private preview">
<meta property="og:description" content="Early access is open. Places are limited.">
<meta property="og:image" content="https://getmavis.vercel.app/brand/mavis-icon-1080.png?v=6">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0F1E2E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0F1E2E url('/tour/preview-bg-m.jpg') center top/cover no-repeat;color:#0F1E2E;-webkit-font-smoothing:antialiased}
@media (min-width:700px){body{background-image:url('/tour/preview-bg-d.jpg')}}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:rgba(15,30,46,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:30px 24px 24px;box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}
.wm{font-weight:800;font-size:26px;letter-spacing:-.5px}.wm em{font-style:normal;color:#0E9C8F}.wm i{font-style:normal;color:#C4973B}
.lock{width:56px;height:56px;border-radius:16px;background:#E3F3F1;color:#0B7A70;display:flex;align-items:center;justify-content:center;margin:20px auto 14px}
.lock svg{width:26px;height:26px}
h1{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em}
p{margin:0 0 20px;color:#55606F;font-size:15px;line-height:1.5}
input{width:100%;height:54px;border-radius:14px;border:1.5px solid #D5DCE4;font:600 19px Inter,system-ui,sans-serif;text-align:center;letter-spacing:.08em;text-transform:uppercase;color:#0F1E2E;outline:none;background:#fff}
input::placeholder{text-transform:none;letter-spacing:0;font-weight:500;font-size:16px;color:#94A3B8}
input:focus{border-color:#0D9488;box-shadow:0 0 0 4px rgba(13,148,136,.15)}
button{width:100%;height:52px;margin-top:12px;border:0;border-radius:999px;background:#0F1E2E;color:#fff;font:700 16px Inter,system-ui,sans-serif;cursor:pointer}
button[disabled]{opacity:.6}
.err{min-height:20px;color:#DC2626;font-size:14px;margin-top:10px;font-weight:600}
.or{display:flex;align-items:center;gap:12px;color:#94A3B8;font-size:13px;margin:16px 0 14px}.or:before,.or:after{content:"";flex:1;height:1px;background:#E2E6EC}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:999px;background:#0D9488;color:#fff;font:700 15px Inter,system-ui,sans-serif;text-decoration:none}
.wa svg{width:18px;height:18px}
.fine{margin-top:16px;color:#94A3B8;font-size:12.5px}
.wait{color:#fff;font-weight:600;font-size:15px}
:focus-visible{outline:3px solid #2DD4BF;outline-offset:3px}
</style></head><body>
<div class="gate" id="wait"><div class="wait">Loading…</div></div>
<div class="gate" id="gate" hidden role="dialog" aria-modal="true" aria-labelledby="gt">
 <form class="card" id="f" autocomplete="off">
  <div class="wm"><em>M</em>avis<i>.</i></div>
  <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1 id="gt">Private preview</h1>
  <p>Enter the access code we sent you to see the full tour.</p>
  <input id="code" placeholder="e.g. SAMSUNG-K7Q4XM2P" aria-label="Access code" autocapitalize="characters" spellcheck="false">
  <button id="go" type="submit">Unlock preview</button>
  <div class="err" id="err" role="alert"></div>
  <div class="or">Don't have a code?</div>
  <a class="wa" href="https://wa.me/6282145328784?text=Hi%20Mavis%2C%20I%27d%20like%20an%20access%20code%20for%20the%20Mavis%20preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.9-.9L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>Request access on WhatsApp</a>
  <div class="fine">Access codes are personal and expire.</div>
 </form>
</div>
<script>
(function(){
  var gate=document.getElementById('gate'), wait=document.getElementById('wait'), err=document.getElementById('err'), go=document.getElementById('go');
  function show(html){ document.open(); document.write(html); document.close(); }
  function load(first){
    return fetch('/api/tour',{credentials:'same-origin',cache:'no-store'}).then(function(r){
      if(r.ok) return r.text().then(show);
      return r.json().catch(function(){return {}}).then(function(j){
        wait.hidden=true; gate.hidden=false;
        if(!first && j.reason==='expired') err.textContent='This code has expired. Request a new one below.';
        if(j.reason==='notset') err.textContent='Previews are not switched on yet.';
        document.getElementById('code').focus();
      });
    }).catch(function(){ wait.hidden=true; gate.hidden=false; err.textContent='Connection problem. Please try again.'; });
  }
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Checking…';
    fetch('/api/verify',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value})})
    .then(function(r){ return r.json().catch(function(){return {}}).then(function(j){
      if(r.ok) return load(false);
      go.disabled=false; go.textContent='Unlock preview';
      err.textContent = j.reason==='expired' ? 'This code has expired. Request a new one below.'
        : j.reason==='notset' ? 'Previews are not switched on yet.'
        : "That code doesn't look right. Please check it and try again.";
    });}).catch(function(){ go.disabled=false; go.textContent='Unlock preview'; err.textContent='Connection problem. Please try again.'; });
  });
  load(true);
})();
</script>
</body></html>
